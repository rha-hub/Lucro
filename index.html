<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucro no Radar</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#eaf5f4;background:#081824}*{box-sizing:border-box}body{margin:0}header{padding:22px 5%;background:#102635;border-bottom:1px solid #274450;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{margin:0;font-size:26px}h1 b,.accent{color:#42dfad}nav{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #385564;background:#1b3949;color:#fff;padding:11px 15px;border-radius:10px;cursor:pointer}button:hover,.active{background:#137b6d}main{max-width:1200px;margin:30px auto;padding:0 18px}.panel{background:#102635;border:1px solid #284455;border-radius:18px;padding:23px;margin:16px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#163748;border-radius:14px;padding:20px}.card strong{display:block;font-size:25px;margin-top:12px;color:#42dfad}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}label{display:block;font-size:13px;color:#b8cbd1;margin:12px 0 5px}input,select{width:100%;background:#091d2b;color:white;border:1px solid #436171;border-radius:9px;padding:12px}input[type=file]{padding:8px}table{border-collapse:collapse;width:100%;min-width:650px}td,th{text-align:left;padding:12px;border-bottom:1px solid #284455}th{color:#91bdc2}.scroll{overflow:auto}.muted{color:#a3b9c3}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.danger{background:#6b2837}.notice{background:#1d3542;border-left:3px solid #42dfad;padding:13px;margin:14px 0}footer{text-align:center;padding:25px;color:#9ab2bc}</style><header><h1>◉ Lucro no <b>Radar</b></h1><nav id="nav"></nav></header><main><h2 id="heading">Visão geral</h2><p class="muted" id="subtitle"></p><div id="content"></div></main><footer>Lucro no Radar • Seus dados ficam neste navegador • Faça backups frequentes</footer><script>
'use strict';
const KEY='lucro-radar-web-v1',types={sales:['date','customer','item','amount','status'],receipts:['date','source','amount'],expenses:['date','description','category','amount'],products:['name','category','cost','price']},labels={sales:'Vendas',receipts:'Recebimentos',expenses:'Despesas',products:'Catálogo'},empty=()=>({settings:{name:'Meu negócio',goal:10000,fee:3},sales:[],receipts:[],expenses:[],products:[],feeds:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||empty()}catch{db=empty()}for(const k of Object.keys(empty()))if(db[k]===undefined)db[k]=empty()[k];let tab='dashboard',staged=null;const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=x=>Number(x||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),today=()=>new Date().toLocaleDateString('sv-SE'),number=x=>{let s=String(x??'').replace(/R\$|\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');return Number(s)},id=()=>crypto.randomUUID(),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()},sum=(a,k)=>a.reduce((n,x)=>n+Number(x[k]||0),0),current=x=>String(x.date).slice(0,7)===today().slice(0,7);
const pages=[['dashboard','Painel'],['sales','Vendas'],['receipts','Recebimentos'],['expenses','Despesas'],['products','Catálogo'],['pricing','Precificação'],['import','Importar'],['connect','Conectar'],['settings','Ajustes']];
function field(k,v=''){const date=k==='date',numeric=['amount','cost','price','goal','fee','margin'].includes(k);return '<div><label>'+esc(({date:'Data',customer:'Cliente',item:'Produto/serviço',amount:'Valor (R$)',status:'Situação',source:'Origem',description:'Descrição',category:'Categoria',name:'Nome',cost:'Custo (R$)',price:'Preço (R$)',goal:'Meta mensal (R$)',fee:'Taxa (%)',margin:'Margem (%)'})[k]||k)+'</label><input name="'+k+'" type="'+(date?'date':numeric?'number':'text')+'" '+(numeric?'min="0" step="0.01"':'')+' value="'+esc(v)+'" required></div>'}
function listing(type){let cols=types[type];return '<div class="panel"><h3>Registros</h3><div class="scroll"><table><thead><tr>'+cols.map(k=>'<th>'+esc(k)+'</th>').join('')+'<th>Ação</th></tr></thead><tbody>'+db[type].slice().reverse().map(x=>'<tr>'+cols.map(k=>'<td>'+esc(['amount','cost','price'].includes(k)?fmt(x[k]):x[k])+'</td>').join('')+'<td><button data-del="'+type+':'+x.id+'">Excluir</button></td></tr>').join('')+'</tbody></table></div></div>'}
function dashboard(){let sales=db.sales.filter(x=>current(x)&&x.status!=='Cancelada'),receipts=db.receipts.filter(current),expenses=db.expenses.filter(current);let items=[['Vendas do mês',sum(sales,'amount')],['Recebido no mês',sum(receipts,'amount')],['Despesas do mês',sum(expenses,'amount')],['Saldo operacional',sum(receipts,'amount')-sum(expenses,'amount')]];return '<div class="cards">'+items.map(([k,v])=>'<div class="card">'+k+'<strong>'+fmt(v)+'</strong></div>').join('')+'</div><div class="panel"><h3>Radar de metas</h3><p>Meta mensal: '+fmt(db.settings.goal)+'</p><progress style="width:100%" max="100" value="'+Math.min(100,db.settings.goal>0?100*sum(sales,'amount')/db.settings.goal:0)+'"></progress><p class="muted">Saldo operacional é recebimentos menos despesas lançadas, não lucro contábil.</p></div>'}
function entry(type){return '<div class="panel"><h3>Novo registro</h3><form id="entry" data-type="'+type+'"><div class="grid">'+types[type].map(k=>field(k,k==='date'?today():k==='status'?'Confirmada':'' )).join('')+'</div><div class="actions"><button>Salvar registro</button></div></form></div>'+listing(type)}
function pricing(){return '<div class="panel"><h3>Precificação</h3><form id="pricing"><div class="grid">'+field('cost',25)+field('fee',db.settings.fee)+field('margin',30)+'</div><div class="actions"><button>Calcular</button></div></form><div id="result"></div><p class="muted">Preço = custo ÷ (1 − taxas% − margem%). Não inclui despesas não informadas.</p></div>'}
function importer(remote=false){return '<div class="panel"><h3>'+(remote?'Conexão HTTPS de CSV público':'Importação guiada de CSV')+'</h3><div class="notice">'+(remote?'Somente fontes públicas sem informações pessoais ou financeiras confidenciais. O servidor precisa permitir CORS. Sincronização manual.':'CSV com cabeçalhos, separador vírgula ou ponto e vírgula. Faça backup antes de importar.')+'</div>'+(remote?'<label>Endereço HTTPS do CSV</label><input id="url" type="url" placeholder="https://exemplo.com/catalogo.csv">':'<label>Arquivo CSV</label><input id="file" type="file" accept=".csv,text/csv">')+'<label>Destino</label><select id="kind">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select><div class="actions"><button id="read">Ler CSV</button></div><div id="preview"></div></div>'}
function settings(){return '<div class="panel"><h3>Seu negócio</h3><form id="settings"><div class="grid">'+field('name',db.settings.name)+field('goal',db.settings.goal)+field('fee',db.settings.fee)+'</div><div class="actions"><button>Salvar ajustes</button></div></form></div><div class="panel"><h3>Backups e exportações</h3><p class="muted">Os dados são armazenados somente neste navegador. Não há contas nem sincronização entre aparelhos.</p><div class="actions"><button id="backup">Baixar backup JSON</button>'+Object.keys(types).map(k=>'<button data-export="'+k+'">Exportar '+labels[k]+' CSV</button>').join('')+'</div><label>Restaurar backup JSON</label><input type="file" id="restorefile" accept=".json"><div class="actions"><button id="restore">Restaurar</button><button id="reset" class="danger">Apagar dados</button></div></div>'}
function render(){ $('nav').innerHTML=pages.map(([k,v])=>'<button data-tab="'+k+'" class="'+(k===tab?'active':'')+'">'+v+'</button>').join('');$('heading').textContent=pages.find(x=>x[0]===tab)[1];$('subtitle').textContent=db.settings.name;$('content').innerHTML=tab==='dashboard'?dashboard():types[tab]?entry(tab):tab==='pricing'?pricing():tab==='import'?importer():tab==='connect'?importer(true):settings()}
function csvParse(s){s=s.replace(/^\uFEFF/,'');const first=s.split(/\r?\n/)[0],delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';let out=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++}else q=!q}else if(c===delim&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);v='';if(row.some(x=>x.trim()))out.push(row);row=[]}else v+=c}row.push(v);if(row.some(x=>x.trim()))out.push(row);return out}
function download(name,content,type='text/plain'){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;try{if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.del){let [type,key]=b.dataset.del.split(':');if(confirm('Excluir registro?')){db[type]=db[type].filter(x=>x.id!==key);save()}}else if(b.id==='read'){let remote=tab==='connect',source=remote?$('url').value:null,content;if(remote){if(!source.startsWith('https://'))throw Error('Informe URL HTTPS');let r=await fetch(source,{credentials:'omit'});if(!r.ok)throw Error('HTTP '+r.status);content=await r.text()}else{let f=$('file').files[0];if(!f)throw Error('Selecione CSV');content=await f.text()}if(content.length>3000000)throw Error('Arquivo maior que 3 MB');let rows=csvParse(content);if(rows.length<2||rows.length>10001)throw Error('CSV vazio ou maior que 10.000 registros');staged={rows:rows.slice(1),headers:rows[0],type:$('kind').value,source};let aliases={date:['date','data'],amount:['amount','valor','total'],name:['name','nome','produto'],customer:['customer','cliente'],item:['item','produto'],description:['description','descricao','descrição'],source:['source','origem'],category:['category','categoria'],cost:['cost','custo'],price:['price','preço','preco'],status:['status','situação','situacao']};$('preview').innerHTML='<h3>Mapear colunas — '+staged.rows.length+' linhas</h3><div class="grid">'+types[staged.type].map(k=>'<div><label>'+k+'</label><select data-map="'+k+'"><option value="">Ignorar</option>'+staged.headers.map((h,i)=>'<option value="'+i+'" '+(aliases[k]?.includes(h.trim().toLowerCase())?'selected':'')+'>'+esc(h)+'</option>').join('')+'</select></div>').join('')+'</div><div class="actions"><button id="confirmImport">Importar dados</button></div>'}else if(b.id==='confirmImport'){let map={};document.querySelectorAll('[data-map]').forEach(el=>map[el.dataset.map]=el.value);let mandatory=staged.type==='products'?['name']:['date',staged.type==='sales'?'amount':'amount'];if(mandatory.some(k=>map[k]===''))throw Error('Mapeie data/valor ou nome');let added=0,ignored=0,keys=types[staged.type];for(let row of staged.rows){let x={};keys.forEach(k=>x[k]=map[k]===''?'':String(row[Number(map[k])]??'').trim());if(x.date&&!/^\d{4}-\d{2}-\d{2}$/.test(x.date)){ignored++;continue}let valid=true;for(let k of ['amount','cost','price'])if(k in x){x[k]=number(x[k]);if(!Number.isFinite(x[k])||x[k]<0)valid=false}if(!valid){ignored++;continue}let sig=y=>keys.map(k=>String(y[k]??'').toLowerCase().trim()).join('|');if(db[staged.type].some(y=>sig(y)===sig(x))){ignored++;continue}x.id=id();db[staged.type].push(x);added++}save();alert(added+' importados; '+ignored+' ignorados');staged=null}else if(b.id==='backup')download('lucro-no-radar.json',JSON.stringify(db,null,2),'application/json');else if(b.dataset.export){let type=b.dataset.export,keys=types[type],quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download(type+'.csv','\uFEFF'+[keys.join(';'),...db[type].map(x=>keys.map(k=>quote(x[k])).join(';'))].join('\r\n'),'text/csv')}else if(b.id==='restore'){let f=$('restorefile').files[0];if(!f)throw Error('Escolha backup');let x=JSON.parse(await f.text());if(!x.settings||Object.keys(types).some(k=>!Array.isArray(x[k])))throw Error('Backup inválido');if(confirm('Substituir dados atuais?')){db=x;save()}}else if(b.id==='reset'){if(confirm('Apagar TODOS os dados?')&&confirm('Confirma exclusão?')){db=empty();save()}}}catch(err){alert(err.message)}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,values=Object.fromEntries(new FormData(f));if(f.id==='pricing'){let cost=number(values.cost),fee=number(values.fee),margin=number(values.margin),den=1-(fee+margin)/100;if(!Number.isFinite(cost)||cost<0||fee<0||margin<0||den<=0) return alert('Verifique os números');$('result').innerHTML='<div class="card">Preço sugerido<strong>'+fmt(cost/den)+'</strong></div>';return}if(f.id==='settings'){db.settings={name:values.name,goal:number(values.goal),fee:number(values.fee)};save();return}let type=f.dataset.type;if(!type)return;for(let k of ['amount','cost','price'])if(k in values){values[k]=number(values[k]);if(!Number.isFinite(values[k])||values[k]<0)return alert('Valor inválido')}values.id=id();db[type].push(values);save()});render();
</script></html>
